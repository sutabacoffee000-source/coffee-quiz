<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブラックエプロン・デイリードリル</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C3B32">
<meta name="description" content="ブラックエプロンチャレンジ対策。毎日15問、コーヒー知識をランダム出題。">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BAドリル">
<style>
  :root{
    --paper:#EFE6D2;
    --paper-deep:#E2D5B7;
    --card:#FBF7EC;
    --ink:#2B1B12;
    --ink-soft:#6B5644;
    --forest:#1C3B32;
    --forest-deep:#12241F;
    --gold:#B98A3E;
    --gold-soft:#E3C089;
    --clay:#A8492E;
    --line: rgba(43,27,18,0.14);
    --radius:20px;
    --font-display:"游明朝体","Yu Mincho",YuMincho,"Hiragino Mincho ProN","HGS明朝E",serif;
    --font-body:"游ゴシック体","Yu Gothic",YuGothic,"ヒラギノ角ゴ ProN W3","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(43,27,18,0.05) 1px, transparent 1.4px) 0 0/22px 22px,
      linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  .eyebrow{
    font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:600;
    text-align:center;margin-bottom:6px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(22px,5.5vw,30px);
    text-align:center;margin:0 0 6px;
    color:var(--forest-deep);
    line-height:1.35;
  }
  .sub{
    text-align:center;color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;
  }
  .badges{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
  .badge{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;font-size:12.5px;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;
  }
  .badge b{color:var(--forest-deep);font-weight:700;}

  .ring-zone{display:flex;justify-content:center;margin-bottom:20px;}
  .ring-svg{display:block;}
  .ring-center{
    position:relative;
  }
  .ring-num{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-num .frac{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--forest-deep);}
  .ring-num .lbl{font-size:10px;color:var(--ink-soft);letter-spacing:.06em;margin-top:2px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 22px;
    box-shadow:0 14px 34px rgba(43,27,18,0.10);
  }
  .tag{
    display:inline-block;background:var(--gold-soft);color:#4A3212;
    font-size:11px;font-weight:700;letter-spacing:.05em;
    padding:4px 10px;border-radius:999px;margin-bottom:14px;margin-right:6px;
  }
  .tag.hot{
    background:var(--clay);color:#FBEFE9;
  }
  .qnum{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .qtext{
    font-family:var(--font-display);
    font-size:clamp(17px,4.4vw,20px);
    line-height:1.6;font-weight:600;
    margin:0 0 20px;color:var(--ink);
  }
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice-btn{
    text-align:left;
    background:#fff;
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px 16px;
    font-family:var(--font-body);
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    display:flex;gap:10px;align-items:flex-start;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .choice-btn:hover:not(:disabled){background:var(--paper);}
  .choice-btn:active:not(:disabled){transform:scale(0.99);}
  .choice-btn:focus-visible{outline:2px solid var(--forest);outline-offset:2px;}
  .choice-btn .mark{
    flex:0 0 20px;height:20px;border-radius:50%;border:1.6px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;
    margin-top:1px;
  }
  .choice-btn.correct{background:rgba(28,59,50,0.10);border-color:var(--forest);}
  .choice-btn.correct .mark{border-color:var(--forest);background:var(--forest);color:#fff;}
  .choice-btn.wrong{background:rgba(168,73,46,0.10);border-color:var(--clay);}
  .choice-btn.wrong .mark{border-color:var(--clay);background:var(--clay);color:#fff;}
  .choice-btn:disabled{cursor:default;}
  .choice-btn.dim{opacity:.55;}

  .note{
    margin-top:16px;padding:12px 14px;border-radius:12px;
    background:rgba(185,138,62,0.12);border:1px solid rgba(185,138,62,0.35);
    font-size:13px;color:#4A3212;line-height:1.6;
  }
  .actions{display:flex;justify-content:flex-end;margin-top:20px;}
  .btn{
    font-family:var(--font-body);
    font-weight:700;font-size:14px;
    border:none;border-radius:999px;
    padding:12px 24px;cursor:pointer;
    background:var(--forest);color:#F6EFDD;
    transition:background .15s ease, opacity .15s ease;
  }
  .btn:hover{background:var(--forest-deep);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn.secondary{
    background:transparent;color:var(--forest-deep);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{background:var(--paper);}
  .btn.ghost{background:transparent;color:var(--clay);padding:8px 12px;font-weight:600;font-size:12.5px;}
  .text-link-btn{
    background:none;border:none;color:var(--ink-soft);font-size:12.5px;
    text-decoration:underline;cursor:pointer;font-family:var(--font-body);
    padding:6px 4px;
  }
  .text-link-btn:focus-visible{outline:2px solid var(--forest);outline-offset:2px;}

  .center-col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;}
  .big-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--forest-deep);}
  .desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7;max-width:380px;}

  .score-big{font-family:var(--font-display);font-size:44px;font-weight:700;color:var(--forest-deep);margin:4px 0 0;}
  .score-sub{font-size:13px;color:var(--ink-soft);}

  .stats-toggle{
    text-align:center;margin-top:18px;
  }
  .stats-toggle button{
    background:none;border:none;color:var(--ink-soft);font-size:12.5px;
    text-decoration:underline;cursor:pointer;font-family:var(--font-body);
  }
  .stats-panel{
    margin-top:14px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;display:none;
  }
  .stats-panel.open{display:block;}
  .stats-panel h3{
    font-family:var(--font-display);font-size:14px;margin:0 0 12px;color:var(--forest-deep);
  }
  .cat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .cat-row .cat-name{flex:0 0 108px;color:var(--ink-soft);}
  .cat-bar-track{flex:1;height:8px;border-radius:5px;background:var(--paper-deep);overflow:hidden;}
  .cat-bar-fill{height:100%;background:linear-gradient(90deg, var(--gold), var(--forest));border-radius:5px;}
  .cat-pct{flex:0 0 34px;text-align:right;color:var(--ink-soft);}
  .stats-foot{
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);
  }
  .reset-zone{margin-top:12px;text-align:right;}
  .confirm-row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px;font-size:12.5px;}

  .footer-note{text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:26px;line-height:1.7;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
  @media (max-width:400px){
    .card{padding:20px 16px;}
    .choice-btn{padding:11px 13px;font-size:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">STARBUCKS COFFEE MASTER</div>
  <h1>ブラックエプロン<br>デイリードリル</h1>
  <p class="sub">毎日15問、コーヒーの必須知識をランダム出題。苦手な問題ほどよく出ます。</p>

  <div class="badges" id="badges"></div>

  <div class="ring-zone">
    <div class="ring-center">
      <svg class="ring-svg" width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="54" fill="none" stroke="var(--paper-deep)" stroke-width="10"/>
        <circle id="ringProgress" cx="66" cy="66" r="54" fill="none" stroke="var(--gold)" stroke-width="10"
          stroke-linecap="round" transform="rotate(-90 66 66)" stroke-dasharray="339.29" stroke-dashoffset="339.29"/>
      </svg>
      <div class="ring-num">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" style="margin-bottom:2px;">
          <path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"/>
          <path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17"/>
          <path d="M6 5c.5 1 .5 1.5 0 2M9 5c.5 1 .5 1.5 0 2M12 5c.5 1 .5 1.5 0 2" stroke-linecap="round"/>
        </svg>
        <div class="frac" id="ringFrac">0/15</div>
        <div class="lbl">本日の進捗</div>
      </div>
    </div>
  </div>

  <div class="card" id="stage">
    <div class="center-col">読み込み中...</div>
  </div>

  <div class="stats-toggle">
    <button id="statsToggleBtn" type="button">📊 これまでの記録・分野別の正答率を見る</button>
  </div>
  <div class="stats-panel" id="statsPanel"></div>

  <p class="footer-note">全156問からランダムに出題／記録はこの端末のこのページにのみ保存されます</p>
</div>

    {id:161,c:'core',q:'ブレックファースト ブレンド（BRK）のパッケージに描かれているモチーフの組み合わせとして正しいのは？',o:['太陽・山・鳥','海・貝殻・波','星・月・雲','火山・虹・花'],a:0},
    {id:162,c:'core',q:'サイレンブレンド（SRN）のパッケージデザインが敬意を表しているのは？',o:['コーヒー業界で活躍する女性たち','世界中の生産者','スターバックスの創業者たち','パートナー（従業員）全員'],a:0},
    {id:163,c:'core',q:'スマトラ（SUM）のパッケージデザインが着目しているのは？',o:['スマトラトラの縞模様とヤシの葉の形の共通点','スマトラ島の火山の形','ジャコウネコの模様','コモドドラゴンのうろこ模様'],a:0}

  var CATS = {
    hist:'歴史', basic:'コーヒーの基礎', proc:'構造・加工法', cafe:'C.A.F.E.プラクティス',
    supply:'サプライチェーン', brew:'抽出の基本', equip:'抽出器具', core:'コアコーヒー',
    mission:'企業理念（Mission/Promise/Values）', news2026:'2026年の時事（30周年・新商品）', misc:'その他'
  };
  var DAILY_COUNT = 15;

  /* ---------------- ユーティリティ ---------------- */
  function fmtDate(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function todayStr(){ return fmtDate(new Date()); }
  function yesterdayStr(){ var d=new Date(); d.setDate(d.getDate()-1); return fmtDate(d); }

  /* ---------------- 保存（ブラウザ標準の localStorage を使用。Claudeログイン不要） ---------------- */
  function loadJSON(key, fallback){
    try{
      var v = localStorage.getItem(key);
      if(v === null) return fallback;
      return JSON.parse(v);
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }
    catch(e){ console.error('save failed', key, e); }
  }
  function deleteKey(key){
    try{ localStorage.removeItem(key); }catch(e){}
  }
  function listKeysWithPrefix(prefix){
    var keys = [];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(prefix)===0) keys.push(k);
      }
    }catch(e){}
    return keys;
  }
  function getQ(id){
    for(var i=0;i<QUESTIONS.length;i++){ if(QUESTIONS[i].id===id) return QUESTIONS[i]; }
    return null;
  }

  /* ---------------- 状態 ---------------- */
  var stats = {};          // {id:{seen,correct}}
  var streak = {lastDate:null, count:0};
  var daily = null;        // {date, ids:[], answers:[{id,choice,correct}], completed:bool}
  var mode = 'daily';      // 'daily' | 'practice'
  var practiceIds = [];
  var practiceAnswers = [];
  var qIndex = 0;          // 現在表示中の問題のインデックス（回答の保存件数とは切り離して管理する）
  var screen = 'loading';  // 'loading'|'home'|'question'|'summary'
  var answeredThisQ = null; // {choice, correct}
  var pendingResetConfirm = false;

  function currentList(){ return mode==='daily' ? daily.ids : practiceIds; }
  function currentAnswers(){ return mode==='daily' ? daily.answers : practiceAnswers; }

  /* ---------------- 出題選択（重み付き） ---------------- */
  function weightFor(q){
    var s = stats[q.id];
    var base;
    if(!s || !s.seen) base = 4 + Math.random()*2;
    else{
      var rate = s.correct / s.seen;
      base = Math.max(0.4, (1-rate)*3) + Math.random()*1.5;
    }
    /* 出題頻度高め（毎年の鉄板分野）の問題は出やすくする */
    return q.hot ? base * 1.7 : base;
  }
  function pickSet(){
    var keyed = QUESTIONS.map(function(q){
      var w = weightFor(q);
      return {id:q.id, key: Math.pow(Math.random(), 1/w)};
    });
    keyed.sort(function(a,b){ return b.key - a.key; });
    var n = Math.min(DAILY_COUNT, QUESTIONS.length);
    return keyed.slice(0, n).map(function(x){ return x.id; });
  }

  /* ---------------- 初期化 ---------------- */
  async function init(){
    stats = await loadJSON('bac-stats', {});
    streak = await loadJSON('bac-streak', {lastDate:null,count:0});
    var t = todayStr();
    daily = await loadJSON('bac-daily-'+t, null);
    if(!daily){
      daily = {date:t, ids:pickSet(), answers:[], completed:false};
      await saveJSON('bac-daily-'+t, daily);
    }
    screen = 'home';
    render();
  }

  /* ---------------- 回答処理 ---------------- */
  async function selectAnswer(idx){
    if(answeredThisQ) return;
    var list = currentList();
    var qi = qIndex;
    var q = getQ(list[qi]);
    var correct = (idx === q.a);
    answeredThisQ = {choice:idx, correct:correct};

    currentAnswers().push({id:q.id, choice:idx, correct:correct});

    if(!stats[q.id]) stats[q.id] = {seen:0, correct:0};
    stats[q.id].seen += 1;
    if(correct) stats[q.id].correct += 1;
    await saveJSON('bac-stats', stats);

    if(mode==='daily'){ await saveJSON('bac-daily-'+daily.date, daily); }
    render();
  }

  async function nextQuestion(){
    answeredThisQ = null;
    qIndex += 1;
    var list = currentList();
    if(currentAnswers().length >= list.length){
      if(mode==='daily'){
        daily.completed = true;
        await saveJSON('bac-daily-'+daily.date, daily);
        var t = todayStr(), y = yesterdayStr();
        if(streak.lastDate === t){
          /* already counted today */
        } else if(streak.lastDate === y){
          streak.count += 1; streak.lastDate = t;
        } else {
          streak.count = 1; streak.lastDate = t;
        }
        await saveJSON('bac-streak', streak);
      }
      screen = 'summary';
    }
    render();
  }

  function startDaily(){
    mode = 'daily';
    qIndex = daily.answers.length;
    screen = 'question';
    answeredThisQ = null;
    render();
  }
  function viewTodaySummary(){
    mode = 'daily';
    screen = 'summary';
    render();
  }
  function startPractice(){
    mode = 'practice';
    practiceIds = pickSet();
    practiceAnswers = [];
    qIndex = 0;
    answeredThisQ = null;
    screen = 'question';
    render();
  }
  function startRepeat(){
    var sameIds = currentList().slice();
    mode = 'practice';
    practiceIds = sameIds;
    practiceAnswers = [];
    qIndex = 0;
    answeredThisQ = null;
    screen = 'question';
    render();
  }
  function goHome(){
    mode = 'daily';
    screen = 'home';
    answeredThisQ = null;
    render();
  }

  /* ---------------- リセット ---------------- */
  async function doReset(){
    deleteKey('bac-stats');
    deleteKey('bac-streak');
    listKeysWithPrefix('bac-daily-').forEach(function(k){ deleteKey(k); });
    stats = {}; streak = {lastDate:null,count:0};
    var t = todayStr();
    daily = {date:t, ids:pickSet(), answers:[], completed:false};
    saveJSON('bac-daily-'+t, daily);
    mode='daily'; screen='home'; answeredThisQ=null; pendingResetConfirm=false;
    render();
  }

  /* ---------------- 描画 ---------------- */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function updateHeader(){
    var badges = document.getElementById('badges');
    var streakTxt = streak.count>0 ? ('🔥 連続 <b>'+streak.count+'</b> 日') : '🔥 今日から始めよう';
    var doneToday = daily.answers.length;
    badges.innerHTML =
      '<div class="badge">'+streakTxt+'</div>'+
      '<div class="badge">☕ 本日 <b>'+doneToday+'/'+DAILY_COUNT+'</b></div>';

    var circumference = 339.29;
    var progress = mode==='daily' ? Math.min(1, daily.answers.length / DAILY_COUNT) : 0;
    var ring = document.getElementById('ringProgress');
    ring.setAttribute('stroke-dashoffset', String(circumference * (1-progress)));
    document.getElementById('ringFrac').textContent = daily.answers.length+'/'+DAILY_COUNT;
  }

  function render(){
    updateHeader();
    var stage = document.getElementById('stage');
    if(screen==='home'){ stage.innerHTML = renderHome(); bindHome(); }
    else if(screen==='question'){ stage.innerHTML = renderQuestion(); bindQuestion(); }
    else if(screen==='summary'){ stage.innerHTML = renderSummary(); bindSummary(); }
    renderStatsPanel();
  }

  function renderHome(){
    var doneToday = daily.answers.length;
    var completed = daily.completed;
    var primaryLabel, primaryHint;
    if(completed){
      primaryLabel = '本日の結果を見る';
      primaryHint = '本日の'+DAILY_COUNT+'問はすでに完了しています。お疲れさまでした！';
    } else if(doneToday>0){
      primaryLabel = '続きから解く（'+doneToday+'/'+DAILY_COUNT+'）';
      primaryHint = '今日の'+DAILY_COUNT+'問の途中です。残り '+(DAILY_COUNT-doneToday)+' 問。';
    } else {
      primaryLabel = '今日の'+DAILY_COUNT+'問を始める';
      primaryHint = '毎日'+DAILY_COUNT+'問、ランダムに出題されます。苦手な問題は繰り返し出やすくなります。';
    }
    var html = '<div class="center-col">';
    html += '<div class="big-title">今日のドリル</div>';
    html += '<p class="desc">'+esc(primaryHint)+'</p>';
    html += '<button class="btn" id="btnPrimary" type="button" style="margin-top:6px;">'+esc(primaryLabel)+'</button>';
    if(completed){
      html += '<button class="btn secondary" id="btnPractice" type="button" style="margin-top:2px;">🔁 追加で復習ラウンドをやる</button>';
    }
    html += '</div>';
    return html;
  }
  function bindHome(){
    var completed = daily.completed;
    document.getElementById('btnPrimary').onclick = function(){
      if(completed){ viewTodaySummary(); } else { startDaily(); }
    };
    var pb = document.getElementById('btnPractice');
    if(pb) pb.onclick = startPractice;
  }

  function renderQuestion(){
    var list = currentList();
    var qi = qIndex;
    var q = getQ(list[qi]);
    var html = '';
    html += '<span class="tag">'+esc(CATS[q.c])+'</span>';
    if(q.hot){ html += '<span class="tag hot">🔥 出題頻度高め！</span>'; }
    html += '<div class="qnum">'+(qi+1)+' / '+list.length+' 問目'+(mode==='practice' ? '（復習ラウンド）' : '')+'</div>';
    html += '<p class="qtext">'+esc(q.q)+'</p>';
    html += '<div class="choices">';
    for(var i=0;i<q.o.length;i++){
      var cls = 'choice-btn';
      var mark = '';
      var disabled = '';
      if(answeredThisQ){
        disabled = 'disabled';
        if(i===q.a){ cls += ' correct'; mark='✓'; }
        else if(i===answeredThisQ.choice){ cls += ' wrong'; mark='✕'; }
        else { cls += ' dim'; }
      }
      html += '<button class="'+cls+'" '+disabled+' data-idx="'+i+'" type="button">'+
              '<span class="mark">'+mark+'</span><span>'+esc(q.o[i])+'</span></button>';
    }
    html += '</div>';
    if(answeredThisQ && q.n){
      html += '<div class="note">💡 '+esc(q.n)+'</div>';
    }
    html += '<div class="actions">';
    if(answeredThisQ){
      var isLast = (qi+1) >= list.length;
      html += '<button class="btn" id="btnNext" type="button">'+(isLast ? '結果を見る' : '次の問題へ')+'</button>';
    } else {
      html += '<button class="btn secondary" disabled type="button" style="opacity:.5;cursor:default;">選択肢を選んでください</button>';
    }
    html += '</div>';
    return html;
  }
  function bindQuestion(){
    var btns = document.querySelectorAll('.choice-btn');
    btns.forEach(function(b){
      b.onclick = function(){ selectAnswer(parseInt(b.getAttribute('data-idx'),10)); };
    });
    var nb = document.getElementById('btnNext');
    if(nb) nb.onclick = nextQuestion;
  }

  function renderSummary(){
    var answers = currentAnswers();
    var correctCount = answers.filter(function(a){return a.correct;}).length;
    var total = answers.length;
    var pct = total ? Math.round((correctCount/total)*100) : 0;

    var byCat = {};
    answers.forEach(function(a){
      var q = getQ(a.id);
      if(!byCat[q.c]) byCat[q.c] = {seen:0, correct:0};
      byCat[q.c].seen++;
      if(a.correct) byCat[q.c].correct++;
    });
    var weakest = null;
    Object.keys(byCat).forEach(function(k){
      var rate = byCat[k].correct/byCat[k].seen;
      if(weakest===null || rate < weakest.rate){ weakest = {cat:k, rate:rate}; }
    });

    var html = '<div class="center-col">';
    html += '<div class="big-title">'+(mode==='practice' ? '復習ラウンド 結果' : '本日の結果')+'</div>';
    html += '<div class="score-big">'+correctCount+' / '+total+'</div>';
    html += '<div class="score-sub">正答率 '+pct+'%</div>';
    if(weakest && total>=4){
      html += '<p class="desc">今回とくに間違いが多かった分野は「<b>'+esc(CATS[weakest.cat])+'</b>」でした。次回はそこを重点的にチェックしましょう。</p>';
    }
    if(mode==='daily'){
      html += '<p class="desc" style="margin-top:2px;">連続記録：🔥 '+streak.count+' 日</p>';
    }
    html += '<p class="desc" style="margin-top:8px;">このあとどうしますか？</p>';
    html += '<button class="btn" id="btnRepeatSame" type="button">🔁 同じ'+total+'問をもう一度解く</button>';
    html += '<button class="btn secondary" id="btnPracticeAgain" type="button">🎲 違う問題でランダム学習する</button>';
    html += '<button class="text-link-btn" id="btnBackHome" type="button">閉じる</button>';
    html += '</div>';
    return html;
  }
  function bindSummary(){
    var bh = document.getElementById('btnBackHome');
    if(bh) bh.onclick = goHome;
    var pa = document.getElementById('btnPracticeAgain');
    if(pa) pa.onclick = startPractice;
    var rs = document.getElementById('btnRepeatSame');
    if(rs) rs.onclick = startRepeat;
  }

  /* ---------------- 分野別スタッツ ---------------- */
  function renderStatsPanel(){
    var panel = document.getElementById('statsPanel');
    var rows = Object.keys(CATS).map(function(k){
      var seen=0, correct=0;
      QUESTIONS.forEach(function(q){
        if(q.c!==k) return;
        var s = stats[q.id];
        if(s){ seen += s.seen; correct += s.correct; }
      });
      var rate = seen ? correct/seen : 0;
      return {cat:k, seen:seen, correct:correct, rate:rate};
    });
    rows.sort(function(a,b){ return a.rate - b.rate; });

    var totalSeen=0, totalCorrect=0;
    Object.keys(stats).forEach(function(id){
      totalSeen += stats[id].seen; totalCorrect += stats[id].correct;
    });

    var html = '<h3>分野別 正答率</h3>';
    rows.forEach(function(r){
      var pct = Math.round(r.rate*100);
      html += '<div class="cat-row">'+
        '<div class="cat-name">'+esc(CATS[r.cat])+'</div>'+
        '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+(r.seen? pct : 0)+'%;"></div></div>'+
        '<div class="cat-pct">'+(r.seen ? pct+'%' : '—')+'</div>'+
      '</div>';
    });
    html += '<div class="stats-foot"><span>累計回答数：'+totalSeen+'問</span><span>累計正答率：'+(totalSeen? Math.round(totalCorrect/totalSeen*100):0)+'%</span></div>';

    if(!pendingResetConfirm){
      html += '<div class="reset-zone"><button class="btn ghost" id="btnResetAsk" type="button">学習記録をリセットする</button></div>';
    } else {
      html += '<div class="confirm-row">本当にすべての記録を削除しますか？'+
        '<button class="btn ghost" id="btnResetYes" type="button" style="color:var(--forest-deep);">はい、削除する</button>'+
        '<button class="btn ghost" id="btnResetNo" type="button">キャンセル</button></div>';
    }
    panel.innerHTML = html;

    var ask = document.getElementById('btnResetAsk');
    if(ask) ask.onclick = function(){ pendingResetConfirm=true; renderStatsPanel(); };
    var yes = document.getElementById('btnResetYes');
    if(yes) yes.onclick = doReset;
    var no = document.getElementById('btnResetNo');
    if(no) no.onclick = function(){ pendingResetConfirm=false; renderStatsPanel(); };
  }

  document.getElementById('statsToggleBtn').onclick = function(){
    var panel = document.getElementById('statsPanel');
    panel.classList.toggle('open');
  };

  init();
})();

/* PWA: サービスワーカーを登録（オフライン対応・ホーム画面追加のため） */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.error('SW register failed', e); });
  });
}
</script>
